</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فضفضة</title><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#0F172A"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXX" crossorigin="anonymous"></script><script src="/ads.loader.js"></script><style>*{font-family:"IBM Plex Sans Arabic","Cairo"}::-webkit-scrollbar{width:0}@keyframes popIn{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}@keyframes pulseDot{0%,100%{transform:scale(1)}50%{transform:scale(1.7);opacity:.5}}</style></head><body id="body" class="min-h-screen overflow-x-hidden bg-[#FFF8E7]"><div class="pointer-events-none fixed inset-0"><div id="blob1" class="absolute -top-[18%] -left-[12%] w-[58%] h-[58%] rounded-full blur-[90px] bg-[#FFD38A] opacity-90"></div><div id="blob2" class="absolute -bottom-[16%] -right-[14%] w-[62%] h-[62%] rounded-full blur-[110px] bg-[#FFECC7] opacity-80"></div></div><div class="sticky top-0 z-30 flex justify-center pt-4 px-4"><div id="headerPill" class="flex items-center gap-3 rounded-full px-5 py-[10px] border backdrop-blur-2xl shadow bg-white/75"><div class="flex gap-2 items-center"><div class="w-7 h-7 rounded-full bg-[#0F172A] flex items-center justify-center text-amber-200 font-bold">ف</div><span class="text-[14px] font-semibold">فضفضة</span></div><div class="w-px h-4 bg-black/10"></div><div class="flex gap-2 text-[11px]"><span class="relative w-2 h-2"><span id="dotPulse" class="absolute inset-0 rounded-full bg-amber-500" style="animation:pulseDot 1.8s infinite"></span><span id="dot" class="relative w-2 h-2 rounded-full bg-amber-500 block"></span></span><span id="phaseLabel">فضفضة</span><span id="timeLabel" class="opacity-60 font-mono"></span></div></div></div><main class="mx-auto max-w-[680px] px-4 pb-[140px] pt-8 relative z-10"><div data-ad-slot="top_feed" id="ad-top" class="mb-6 rounded-[18px] border bg-white/70 p-3 text-center"><div class="text-[9px] opacity-30">جاري تحميل الإعلان...</div></div><div id="feedInput" class="hidden mb-6 rounded-[24px] border bg-white/80 backdrop-blur-xl p-3 flex gap-2 items-end"><div class="flex gap-1"><button onclick="setEmoji('🌙')" class="w-8 h-8 rounded-full">🌙</button><button onclick="setEmoji('☕')" class="w-8 h-8">☕</button><button onclick="setEmoji('✨')" class="w-8 h-8 bg-zinc-900 text-white rounded-full">✨</button><button onclick="setEmoji('🌿')" class="w-8 h-8">🌿</button><button onclick="setEmoji('🔥')" class="w-8 h-8">🔥</button></div><input id="postText" placeholder="فضفض من قلبك.." class="flex-1 bg-transparent outline-none px-2" maxlength="180"><button onclick="addPost()" class="w-10 h-10 rounded-full bg-zinc-900 text-white">➤</button></div><div id="postsContainer"></div><div id="mineContainer" class="hidden"></div><div id="dmContainer" class="hidden"></div><div id="adminContainer" class="hidden"></div></main><div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40"><div id="bottomNav" class="flex gap-1 rounded-full p-1.5 backdrop-blur-2xl border bg-white/90 shadow"><button onclick="switchTab('wall')" data-tab="wall" class="bg-zinc-900 text-white flex gap-2 rounded-full px-4 py-2.5"><span>🏠</span><span class="text-[12px]">الساحة</span></button><button onclick="switchTab('mine')" data-tab="mine" class="flex gap-2 rounded-full px-4 py-2.5 text-zinc-500"><span>💛</span><span class="text-[12px]">خواطري</span></button><button onclick="switchTab('dm')" data-tab="dm" class="flex gap-2 rounded-full px-4 py-2.5 text-zinc-500"><span>💬</span><span class="text-[12px]">الخاص</span></button><button onclick="switchTab('admin')" id="adminTabBtn" class="hidden gap-2 rounded-full px-4 py-2.5 text-zinc-500"><span>🛡️</span><span class="text-[12px]">لوحة</span></button></div></div><div id="loginModal" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4 bg-black/40 backdrop-blur"><div class="w-full max-w-[360px] rounded-[28px] bg-white p-6 shadow-2xl" style="animation:popIn .4s"><div class="flex justify-between mb-6"><div><div class="text-[18px] font-black">فضفضة 2026</div><div class="text-[10px] opacity-50">مساحة آمنة للفضفضة</div></div><div class="text-[11px] opacity-60"><span id="modalPhase"></span> • <span id="modalTime"></span></div></div><div class="grid gap-3"><div class="flex gap-1.5"><button onclick="setRegEmoji('🌙')" class="w-9 h-9 rounded-full border">🌙</button><button onclick="setRegEmoji('☕')" class="w-9 h-9 rounded-full border">☕</button><button onclick="setRegEmoji('✨')" class="w-9 h-9 rounded-full border bg-zinc-900 text-white">✨</button></div><input id="phoneInput" placeholder="رقم التليفون 010xxxxxxxx" class="w-full rounded-full bg-zinc-100 px-5 py-3.5 text-[14px] outline-none" maxlength="11"><input id="nameInput" placeholder="اسمك المستعار" class="w-full rounded-full bg-zinc-100 px-5 py-3.5 text-[14px] outline-none"><input id="adminPassInput" placeholder="كلمة سر الأدمن" type="password" class="hidden w-full rounded-full bg-zinc-100 px-5 py-3.5 text-[14px] outline-none"><div id="loginError" class="hidden text-[12px] text-red-500 px-2"></div><button onclick="doLogin()" class="w-full rounded-full bg-zinc-900 text-white py-3.5 text-[14px] font-bold">دخول آمن 🔐</button><div data-ad-slot="login_banner" class="mt-2 rounded-[16px] bg-zinc-50 border p-2 text-center"><div class="text-[8px] opacity-30">جاري تحميل الإعلان...</div></div><div class="flex justify-between text-[11px]"><span class="opacity-60">رقم واحد = حساب واحد</span><button id="guestBtn" onclick="loginGuest()" class="rounded-full px-3 py-1 bg-zinc-100 text-zinc-400 text-[12px]">سهران 🌙</button></div></div></div></div><footer class="mt-12 py-6 text-center border-t border-black/5"><div class="text-[11px] text-zinc-400"><span id="footerTime">💜 فضفضة</span></div><div class="mt-1 text-[10px] text-zinc-300">مساحة آمنة للفضفضة</div></footer><script>
const PHASES={sabah:{label:"فضفضة",bg:"#FFF8E7",fg:"#5a3e1b",dot:"#f59e0b",blob1:"#FFD38A",blob2:"#FFECC7"},gad:{label:"وقت الجد",bg:"#F3F4F6",fg:"#1f2937",dot:"#6b7280",blob1:"#CBD5E1",blob2:"#E2E8F0"},rawaqan:{label:"وقت الروقان",bg:"#FFEEE5",fg:"#7c2d12",dot:"#f97316",blob1:"#FFB4A2",blob2:"#FFD6C7"},sehhar:{label:"لمة السهرانين",bg:"#0F172A",fg:"#e2e8f0",dot:"#38bdf8",blob1:"#1E3A5F",blob2:"#334155"}};
function cairoNow(){
  const n=new Date();
  const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,day:'2-digit',month:'2-digit',year:'numeric'}).formatToParts(n);
  const g=t=>p.find(x=>x.type===t)?.value||"00";
  const now=new Date(new Date().toLocaleString('en-US',{timeZone:'Africa/Cairo'}));
  const fullDate=new Intl.DateTimeFormat('ar-EG',{timeZone:'Africa/Cairo',day:'numeric',month:'long',year:'numeric'}).format(now);
  return{h:parseInt(g('hour')),label:`${g('hour')}:${g('minute')}`,labelSec:`${g('hour')}:${g('minute')}:${g('second')}`,day:parseInt(g('day')),caDate:`${g('day')}/${g('month')}/${g('year')}`,fullDate:fullDate,year:g('year')}
}
function getPhase(h){if(h>=8&&h<=11)return'sabah';if(h>=12&&h<=15)return'gad';if(h>=16&&h<=23)return'rawaqan';return'sehhar'}
let currentUser=JSON.parse(localStorage.getItem('lametna_sess_v3')||'null');let users=JSON.parse(localStorage.getItem('lametna_users_v3')||'[]');let posts=JSON.parse(localStorage.getItem('lametna_posts_v3')||'[]');let kalima=localStorage.getItem('lametna_kalima_v3')||'';let currentEmoji='✨',regEmoji='✨',currentTab='wall';let authToken=localStorage.getItem('lametna_token_v3')||'';let adsData={};
function save(){localStorage.setItem('lametna_users_v3',JSON.stringify(users));localStorage.setItem('lametna_posts_v3',JSON.stringify(posts.slice(0,200)));localStorage.setItem('lametna_kalima_v3',kalima);if(currentUser)localStorage.setItem('lametna_sess_v3',JSON.stringify(currentUser));if(authToken)localStorage.setItem('lametna_token_v3',authToken);}
function updateTheme(){const {h,label,labelSec,caDate,fullDate,year,day}=cairoNow();const phase=getPhase(h);const p=PHASES[phase];document.getElementById('body').style.background=p.bg;document.getElementById('body').style.color=p.fg;document.getElementById('blob1').style.background=p.blob1;document.getElementById('blob2').style.background=p.blob2;document.getElementById('dot').style.background=p.dot;document.getElementById('dotPulse').style.background=p.dot;document.getElementById('phaseLabel').innerText=p.label;document.getElementById('timeLabel').innerText=label;document.getElementById('modalPhase').innerText=p.label;document.getElementById('modalTime').innerText=label;document.getElementById('footerTime').innerText='💜 فضفضة • '+cairoNow().fullDate;}
function setEmoji(e){currentEmoji=e}function setRegEmoji(e){regEmoji=e}
document.getElementById('nameInput').addEventListener('input',e=>{if(e.target.value.toLowerCase()==='admin')document.getElementById('adminPassInput').classList.remove('hidden')});
async function doLogin(){const phone=document.getElementById('phoneInput').value.trim(),name=document.getElementById('nameInput').value.trim(),adminPass=document.getElementById('adminPassInput').value;const err=document.getElementById('loginError');err.classList.add('hidden');if(!/^01[0125][0-9]{8}$/.test(phone)&&phone!=='01000'){err.innerText='رقم غلط';err.classList.remove('hidden');return}try{if(location.hostname.includes('pages.dev')){const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,username:name,emoji:regEmoji,adminPass})});const d=await r.json();if(!r.ok)throw new Error(d.error);currentUser=d.user;authToken=d.token||'';save();document.getElementById('loginModal').classList.add('hidden');renderAll();return}}catch(e){err.innerText=e.message;err.classList.remove('hidden');return}if(phone==='01000'){const enc=new TextEncoder().encode(adminPass||'');const buf=await crypto.subtle.digest('SHA-256',enc);const hash=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');if(hash!=='82a10f2ca79e1d9740da9c7b49b26eeee57c78c04f7fb4eb9c7c3d618392e5e4'){err.innerText='باسورد غلط';err.classList.remove('hidden');return}currentUser={phone:'01000',username:'أحمد',emoji:'🛡️',role:'admin',points:999999,withdrawals:[]};let ex=users.find(u=>u.phone==='01000');if(!ex)users.push(currentUser);else ex.role='admin';save();location.reload();return}if(name.length<2){err.innerText='الاسم قصير';err.classList.remove('hidden');return}let ex=users.find(u=>u.phone===phone);if(ex)currentUser=ex;else{if(users.find(u=>u.username===name)){err.innerText='الاسم موجود';err.classList.remove('hidden');return}currentUser={phone,username:name,emoji:regEmoji,role:'user',points:0,withdrawals:[],createdAt:Date.now()};users.push(currentUser)}save();document.getElementById('loginModal').classList.add('hidden');renderAll();}
function loginGuest(){const {h}=cairoNow();if(getPhase(h)!=='sehhar'){alert('السهرانين من 12 لـ 7 بس');return}const n=Math.floor(Math.random()*900+100);currentUser={phone:null,username:`سهران-${n}`,emoji:'🌌',role:'guest',points:0,withdrawals:[]};localStorage.setItem('lametna_sess_v3',JSON.stringify(currentUser));document.getElementById('loginModal').classList.add('hidden');renderAll();}
function logout(){currentUser=null;authToken='';localStorage.removeItem('lametna_sess_v3');localStorage.removeItem('lametna_token_v3');document.getElementById('loginModal').classList.remove('hidden');renderAll();}
async function loadPosts(){try{if(location.hostname.includes('pages.dev')){const r=await fetch('/api/posts',{headers: authToken?{Authorization:`Bearer ${authToken}`}:{}});if(r.ok){const d=await r.json();posts=d.map(p=>({...p,likedBy:JSON.parse(p.likedBy||'[]'),heartedBy:JSON.parse(p.heartedBy||'[]'),coffeedBy:JSON.parse(p.coffeedBy||'[]')}));save()}}}catch(e){}renderPosts();}
async function addPost(){const text=document.getElementById('postText').value.trim();if(!text||!currentUser)return;const {h}=cairoNow();const phase=getPhase(h);const p={id:Math.random().toString(36).slice(2),authorPhone:currentUser.phone,author:currentUser.username,emoji:currentEmoji,text,phase,timestamp:Date.now(),likes:0,hearts:0,coffees:0,likedBy:[],heartedBy:[],coffeedBy:[],isSehhar:currentUser.role==='guest'||phase==='sehhar'};try{if(location.hostname.includes('pages.dev')){await fetch('/api/posts',{method:'POST',headers:{'Content-Type':'application/json',...(authToken?{Authorization:`Bearer ${authToken}`}:{})},body:JSON.stringify({action:'create',...p})})}}catch(e){}posts=[p,...posts];document.getElementById('postText').value='';save();renderPosts();}
async function react(postId,type){if(!currentUser?.phone){alert('سجل برقمك');return}const post=posts.find(p=>p.id===postId);if(!post)return;try{if(location.hostname.includes('pages.dev')){await fetch('/api/posts',{method:'POST',headers:{'Content-Type':'application/json',...(authToken?{Authorization:`Bearer ${authToken}`}:{})},body:JSON.stringify({action:'react',postId,type,reactorPhone:currentUser.phone})})}}catch(e){}const ph=currentUser.phone;let f,b,pts;if(type==='like'){f='likes';b='likedBy';pts=1}if(type==='heart'){f='hearts';b='heartedBy';pts=2}if(type==='coffee'){f='coffees';b='coffeedBy';pts=5}const has=post[b].includes(ph);const owner=users.find(u=>u.phone===post.authorPhone);if(has){post[b]=post[b].filter(x=>x!==ph);post[f]--;if(owner){owner.points=Math.max(0,(owner.points||0)-pts);if(currentUser.phone===owner.phone)currentUser.points=owner.points}}else{post[b].push(ph);post[f]++;if(owner){owner.points=(owner.points||0)+pts;if(currentUser.phone===owner.phone)currentUser.points=owner.points}}save();renderPosts();if(currentTab==='mine')renderMine();}
function deletePost(id){if(!confirm('تمسح؟'))return;posts=posts.filter(p=>p.id!==id);save();renderPosts();renderMine();}
async function withdraw(){if(!currentUser?.phone||(currentUser.points||0)<100000){alert('لسه');return}try{if(location.hostname.includes('pages.dev')){await fetch('/api/withdraw',{method:'POST',headers:{'Content-Type':'application/json',...(authToken?{Authorization:`Bearer ${authToken}`}:{})},body:JSON.stringify({action:'create',phone:currentUser.phone,id:Math.random().toString(36).slice(2)})})}}catch(e){}currentUser.points-=100000;const w={id:Math.random().toString(36).slice(2),amount:100,points:100000,phone:currentUser.phone,date:Date.now(),status:'pending'};currentUser.withdrawals=currentUser.withdrawals||[];currentUser.withdrawals.unshift(w);const u=users.find(x=>x.phone===currentUser.phone);if(u){u.points=currentUser.points;u.withdrawals=currentUser.withdrawals}save();alert('طلب سحب 100 جنيه اتبعت');renderMine();}

async function loadAds(){try{const r=await fetch('/api/ads');if(r.ok){const d=await r.json();adsData=d.slots||{};}}catch(e){}}
async function saveAd(slot){const html=document.getElementById('ad-html-'+slot).value;const enabled=document.getElementById('ad-enabled-'+slot).checked;const label=document.getElementById('ad-label-'+slot).value;const adminPass=prompt('أدخل باسورد الأدمن لحفظ الإعلان:');if(!adminPass)return;const res=await fetch('/api/ads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slot,html,enabled,label,type:'custom',adminPass,adminPhone:'01000'})});const data=await res.json();if(res.ok){alert('✅ تم حفظ الإعلان - يشتغل مع أي شركة!\nالآن الإعلان ظاهر في الموقع');loadAds();if(window.FADFADA_ADS)window.FADFADA_ADS.init();}else alert('خطأ: '+data.error);}


function sharePost(id){
  const post=posts.find(p=>p.id===id);
  if(!post) return;
  const text=post.text+' - من فضفضة 💜';
  const url=location.origin+location.pathname+'#post-'+id;
  if(navigator.share){
    navigator.share({title:'فضفضة',text:text,url:url}).catch(()=>{showShareMenu(id,text,url);});
  } else {
    showShareMenu(id,text,url);
  }
}
function showShareMenu(id,text,url){
  const old=document.getElementById('share-menu-'+id);
  if(old){old.remove();return;}
  document.querySelectorAll('[id^="share-menu-"]').forEach(e=>e.remove());
  const menu=document.createElement('div');
  menu.id='share-menu-'+id;
  menu.className='absolute bottom-12 left-4 z-20 bg-white rounded-2xl shadow-[0_20px_60px_rgba(0,0,0,.2)] border p-2 flex flex-col gap-1 min-w-[200px]';
  const encText=encodeURIComponent(text);
  const encUrl=encodeURIComponent(url);
  menu.innerHTML='<button onclick="window.open(\'https://wa.me/?text='+encText+'%20'+encUrl+'\',\'_blank\')" class="flex gap-2 items-center px-3 py-2 rounded-xl hover:bg-green-50 text-[13px]"><span class="w-7 h-7 rounded-full bg-green-500 text-white flex items-center justify-center">W</span> واتساب</button>'+'<button onclick="window.open(\'https://www.facebook.com/sharer/sharer.php?u='+encUrl+'\',\'_blank\')" class="flex gap-2 items-center px-3 py-2 rounded-xl hover:bg-blue-50 text-[13px]"><span class="w-7 h-7 rounded-full bg-blue-600 text-white flex items-center justify-center">f</span> فيسبوك</button>'+'<button onclick="window.open(\'https://twitter.com/intent/tweet?text='+encText+'&url='+encUrl+'\',\'_blank\')" class="flex gap-2 items-center px-3 py-2 rounded-xl hover:bg-sky-50 text-[13px]"><span class="w-7 h-7 rounded-full bg-black text-white flex items-center justify-center">𝕏</span> تويتر</button>'+'<button onclick="window.open(\'https://t.me/share/url?url='+encUrl+'&text='+encText+'\',\'_blank\')" class="flex gap-2 items-center px-3 py-2 rounded-xl hover:bg-sky-50 text-[13px]"><span class="w-7 h-7 rounded-full bg-sky-500 text-white flex items-center justify-center">T</span> تليجرام</button>'+'<button onclick="navigator.clipboard.writeText(\''+url+'\').then(()=>alert(\'تم نسخ الرابط ✅\'))" class="flex gap-2 items-center px-3 py-2 rounded-xl hover:bg-zinc-50 text-[13px]"><span class="w-7 h-7 rounded-full bg-zinc-800 text-white flex items-center justify-center">🔗</span> نسخ الرابط</button>'+'<button onclick="this.closest(\'[id^=share-menu-]\').remove()" class="mt-1 px-3 py-1.5 rounded-full bg-zinc-100 text-[11px] text-center">إغلاق</button>';
  const postEl=document.querySelector('[data-post-id="'+id+'"]');
  if(postEl){postEl.style.position='relative';postEl.appendChild(menu);}
}

function renderPosts(){const {h}=cairoNow();const phase=getPhase(h);const c=document.getElementById('postsContainer');let filtered=posts.filter(p=>{if(p.isSehhar&&h>=8&&phase!=='sehhar')return false;return true});if(filtered.length===0){c.innerHTML=`<div class="py-24 text-center"><div class="inline-flex rounded-full px-5 py-2.5 text-[13px] border bg-white/80">لسه مفيش كلام.. ابدأ انت في فضفضة</div></div>`;return}c.innerHTML=filtered.map((p,i)=>{const ad=(i>0&&i%5===0)?`<div data-ad-slot="feed_every_5" class="my-4 rounded-[22px] border bg-white/70 p-3 text-center"><div class="text-[9px] opacity-30">جاري تحميل الإعلان...</div></div>`:'';const time=new Date(p.timestamp).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Cairo'});const isOwner=currentUser&&(currentUser.phone===p.authorPhone||currentUser.role==='admin');const liked=currentUser?.phone&&p.likedBy.includes(currentUser.phone);const hearted=currentUser?.phone&&p.heartedBy.includes(currentUser.phone);const coffeed=currentUser?.phone&&p.coffeedBy.includes(currentUser.phone);const isS=phase==='sehhar';return ad+`<div data-post-id="${p.id}" class="group relative rounded-[22px] border p-4 flex gap-3 mb-3 ${isS?'bg-[#1E293B]/90 text-slate-100':'bg-white text-zinc-800'}"><div class="w-10 h-10 rounded-full flex items-center justify-center bg-zinc-100 shrink-0">${p.emoji}</div><div class="flex-1"><div class="flex gap-2 items-baseline"><span class="text-[13px] font-bold">${p.isSehhar?'سهران':p.author}</span><span class="text-[11px] opacity-50 font-mono">${time}</span></div><div class="mt-1 text-[14px] leading-6">${p.text}</div><div class="mt-3 flex gap-2"><button onclick="sharePost('${p.id}')" class="h-7 px-3 rounded-full border text-[11px] font-bold flex gap-1 items-center bg-white/60 border-black/10 hover:bg-white">↗️ شير</button><button onclick="react('${p.id}','like')" class="h-7 px-3 rounded-full border text-[11px] font-bold ${liked?'bg-blue-500 text-white':''}">👍 ${p.likes||0}</button><button onclick="react('${p.id}','heart')" class="h-7 px-3 rounded-full border text-[11px] font-bold ${hearted?'bg-red-500 text-white':''}">❤️ ${p.hearts||0}</button><button onclick="react('${p.id}','coffee')" class="h-7 px-3 rounded-full border text-[11px] font-bold ${coffeed?'bg-amber-500 text-white':''}">☕ ${p.coffees||0}</button>${isOwner?`<button onclick="deletePost('${p.id}')" class="w-7 h-7 rounded-full bg-black/5 opacity-0 group-hover:opacity-100">🗑️</button>`:''}</div></div></div>`}).join('');if(window.FADFADA_ADS)window.FADFADA_ADS.renderAll();}

function renderDM(){const c=document.getElementById('dmContainer');const others=users.filter(u=>u.phone!==currentUser?.phone);c.innerHTML=`<div class="rounded-[24px] border p-3 bg-white/80"><div class="font-bold text-[14px] mb-3">الناس (${others.length})</div><div class="space-y-1.5">${others.map(u=>`<div class="flex gap-2 p-2.5 rounded-xl border bg-white"><div class="w-8 h-8 rounded-full bg-amber-100 flex items-center justify-center">${u.emoji}</div><div><div class="text-[13px] font-bold">${u.username}</div><div class="text-[10px] opacity-60">${u.points||0} نقطة</div></div></div>`).join('')||'لسه مفيش ناس'}</div></div>`;}

function switchTab(tab){currentTab=tab;document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.remove('bg-zinc-900','text-white');b.classList.add('text-zinc-500')});document.querySelector(`[data-tab="${tab}"]`).classList.add('bg-zinc-900','text-white');['postsContainer','mineContainer','dmContainer','adminContainer'].forEach(id=>document.getElementById(id).classList.add('hidden'));if(tab==='wall'){document.getElementById('postsContainer').classList.remove('hidden');document.getElementById('feedInput').classList.remove('hidden');document.getElementById('ad-top').classList.remove('hidden');}if(tab==='mine'){document.getElementById('mineContainer').classList.remove('hidden');renderMine()}if(tab==='dm'){document.getElementById('dmContainer').classList.remove('hidden');renderDM()}if(tab==='admin'){document.getElementById('adminContainer').classList.remove('hidden');renderAdmin()}if(tab==='wall')renderPosts();}

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocu
